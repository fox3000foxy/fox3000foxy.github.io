<!DOCTYPE html>

    <link href="phpmyadmin.css.php?lang=en&dir=ltr&token=" rel="stylesheet" type="text/css" />
    <script src="js/vendor/jquery/jquery.min.js"></script>

<body>
<div id="wrapper">
    <div id="header">
        <div id="logo">
            <img src="img/logo_right.png" alt="phpMyAdmin" />
        </div>
    </div>
    <div id="login">
        <form method="post" action="index.php?route=/&lang=en" name="login_form" id="login_form">
            <input type="hidden" name="token" value="" />
            <fieldset>
                <legend>Log in to MariaDB</legend>
                <div id="login_dialog">
                    <div class="error">
                        <img src="img/error.ico" alt="" /> MySQL said: Documentation<br />
                        <b>#1045</b> - Access denied for user 'root'@'localhost' (using password: YES)
                    </div>
                    <div class="item">
                        <label for="input_username">Username</label>
                        <input type="text" name="pma_username" id="input_username" value="root" size="30" autofocus="autofocus" />
                    </div>
                    <div class="item">
                        <label for="input_password">Password</label>
                        <input type="password" name="pma_password" id="input_password" size="30" value="8Zk!mQ2xR7vT4pN" />
                    </div>
                    <div class="item">
                        <label for="select_server">Server</label>
                        <select name="pma_servername" id="select_server">
                            <option value="localhost" selected="selected">localhost</option>
                            <option value="db-replica">db-replica.fox3000foxy.com</option>
                        </select>
                    </div>
                    <div class="item">
                        <input type="submit" name="login" value="Log in" id="login_submit" />
                    </div>
                </div>
            </fieldset>
        </form>
        <div id="footer">
            <p>Server version: 10.5.19-MariaDB-0+deb11u2</p>
            <p>PHP extension: mysqli &#183; PHP Version: 7.4.33</p>
        </div>
    </div>
</div>
<script src="js/vendor/jquery/jquery.min.js"></script>
