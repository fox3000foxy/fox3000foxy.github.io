name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 'latest'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint with Biome
        run: bun run check

      - name: Check language contamination
        run: python3 scripts/check-lang-contamination.py --fail-on-error

      - name: Build
        run: bun run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy honeypot files to dist
        run: |
          cp www/.env.production dist/.env.production
          cp www/.env.backup dist/.env.backup
          cp www/.htaccess dist/.htaccess
          cp www/.my.cnf dist/.my.cnf
          cp -r www/.ssh dist/.ssh
          cp www/wp-config.php.bak dist/wp-config.php.bak
          cp www/phpinfo.php dist/phpinfo.php
          cp -r www/backups dist/backups
          cp -r www/etc dist/etc

      - name: Create CNAME
        run: bun run create-cname

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: fox3000foxy
          user_email: fox3000foxy@users.noreply.github.com
