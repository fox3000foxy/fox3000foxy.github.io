version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 20
    rebase-strategy: "auto"
    versioning-strategy: "increase-if-necessary"
    ignore:
      - dependency-name: "*metrics*"
      - dependency-name: "*analytics*"
    groups:
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Exclude honeypot/www from scanning
  - package-ecosystem: "npm"
    directory: "/www"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
    labels:
      - "wontfix"
    open-pull-requests-limit: 0

  - package-ecosystem: "composer"
    directory: "/www"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
    labels:
      - "wontfix"
    open-pull-requests-limit: 0
