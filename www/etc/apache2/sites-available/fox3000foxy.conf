<VirtualHost *:80>
	ServerName fox3000foxy.com
	ServerAlias www.fox3000foxy.com
	ServerAdmin fox3000foxy@srv-mail.net

	DocumentRoot /var/www/fox3000foxy.com/public_html

	<Directory /var/www/fox3000foxy.com/public_html>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	RewriteEngine On
	RewriteCond %{HTTPS} !on
	RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

	ErrorLog /var/log/apache2/fox3000foxy.error.log
	CustomLog /var/log/apache2/fox3000foxy.access.log combined
</VirtualHost>

<VirtualHost *:443>
	ServerName fox3000foxy.com
	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/fox3000foxy.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/fox3000foxy.com/privkey.pem

	<FilesMatch "\.php$">
		Require all granted
	</FilesMatch>
</VirtualHost>